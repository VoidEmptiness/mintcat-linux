[package]
name = "mintcat"
version = "0.6.0"
description = "Mod Integrate Tool"
authors = ["iriscat"]
edition = "2021"

[workspace]
members = [
    ".",
    "crates/mintcat-integrator-api",
    "crates/mintcat-integrator-core",
    "crates/mintcat-integrator-ffi",
    "crates/oodle_loader",
]

# repak's Oodle loader saved the downloaded Oodle library next to the program, which an
# AppImage can't write to: our copy also uses MINTCAT's data folder (crates/oodle_loader)
[patch."https://github.com/trumank/repak"]
oodle_loader = { path = "crates/oodle_loader" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mintcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2.12", features = ["devtools", "protocol-asset"] }
tauri-plugin-fs = "2.6"
tauri-plugin-shell = "2.4"
tauri-plugin-os = "2.4"
tauri-plugin-log = "2.10"
tauri-plugin-dialog = "2.8"
tauri-plugin-process = "2.4"
tauri-plugin-opener = "2.6"
tauri-plugin-updater = "2.13"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-store = "2.5"
tauri-plugin-sql = { version = "2.5",features = ["sqlite"] }
tauri-plugin-sentry = "0.4"
tauri-plugin-task-queue = { git = "https://github.com/iriscats/tauri-plugin-task-queue" }
tauri-plugin-deep-link = "~2.5"
tauri-plugin-single-instance = "2"

anyhow = "1"
log = "0.4.27"
tracing = { version = "0.1.41", features = ["attributes"] }

# http
reqwest = { version = "0.12.15", features = ["blocking", "stream", "json", "native-tls"] }
tokio = { version = "1", features = ["full"] }
md5 = "0.7"
sha2 = "0.10"
rand = "0.8"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

# json
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mintcat-integrator-api = { path = "crates/mintcat-integrator-api" }
libloading = "0.8"

# integrate
zip = { version = "2.2.0", default-features = false, features = ["aes-crypto", "deflate", "time"] }

# Clipboard change notifications (copying the same link again opens Add Mod again);
# the same versions the clipboard plugin already uses
[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.5"
x11rb = { version = "0.13.2", features = ["xfixes"] }

# 系统代理检测（未手动设置代理时使用），通过注册表读取兼容所有 Win10 版本
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

